name: CI Build for macOS ARM64

on:
  push:
    branches: [ '**' ]
  pull_request:
  workflow_dispatch:

jobs:
  macos-arm64:
    name: Build macOS (arm64)
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up build environment variables
        id: setup
        run: |
          DATEFILE=$(git log -1 --date=format:'%Y_%m_%d_%H%M' --format='%ad')
          echo "datefile=$DATEFILE" >> $GITHUB_OUTPUT
          echo "filename=openxcom_${DATEFILE}_macos_arm64" >> $GITHUB_OUTPUT

      - name: Install dependencies via Homebrew
        run: |
          brew update
          brew install cmake pkg-config sdl12-compat sdl_gfx yaml-cpp zlib dylibbundler ccache

      - name: Build SDL_image 1.2.12 manually
        run: |
          curl -LO https://www.libsdl.org/projects/SDL_image/release/SDL_image-1.2.12.tar.gz
          tar -xzf SDL_image-1.2.12.tar.gz
          cd SDL_image-1.2.12
          ./configure --prefix=/opt/homebrew
          make -j$(sysctl -n hw.ncpu)
          sudo make install

      - name: Build SDL_mixer 1.2.12 manually
        run: |
          curl -LO https://www.libsdl.org/projects/SDL_mixer/release/SDL_mixer-1.2.12.tar.gz
          tar -xzf SDL_mixer-1.2.12.tar.gz
          cd SDL_mixer-1.2.12
          ./configure --prefix=/opt/homebrew
          make -j$(sysctl -n hw.ncpu)
          sudo make install

      - name: Set environment variables
        run: |
          echo "LDFLAGS=-L/opt/homebrew/opt/zlib/lib" >> $GITHUB_ENV
          echo "CPPFLAGS=-I/opt/homebrew/opt/zlib/include" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=/opt/homebrew/lib/pkgconfig" >> $GITHUB_ENV
          echo "CMAKE_C_COMPILER_LAUNCHER=ccache" >> $GITHUB_ENV
          echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache" >> $GITHUB_ENV

      - name: Configure and build with CMake
        env:
          LDFLAGS: ${{ env.LDFLAGS }}
          CPPFLAGS: ${{ env.CPPFLAGS }}
          PKG_CONFIG_PATH: ${{ env.PKG_CONFIG_PATH }}
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: |
          mkdir build
          cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.9 \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DBUILD_TESTING=OFF \
            -DDOXYGEN_FOUND=FALSE
          make -j$(sysctl -n hw.ncpu)

      - name: Bundle libraries with dylibbundler
        run: |
          cd build
          mkdir -p openxcom.app/Contents/Frameworks
          dylibbundler -od -b -x openxcom.app/Contents/MacOS/openxcom \
            -d openxcom.app/Contents/Frameworks \
            -p @executable_path/../Frameworks/
          install_name_tool -add_rpath @executable_path/../Frameworks openxcom.app/Contents/MacOS/openxcom

      - name: Bundle all manually linked libraries
        run: |
          cd build

          for LIBNAME in \
            libSDL-1.2.0.dylib \
            libz.1.dylib \
            libSDL_image-1.2.0.dylib \
            libSDL_mixer-1.2.0.dylib; do

            SRC=$(find /opt/homebrew/lib /opt/homebrew/opt/zlib/lib -name "$LIBNAME" | head -n 1)
            cp "$SRC" openxcom.app/Contents/Frameworks/
            install_name_tool -change "$SRC" "@executable_path/../Frameworks/$LIBNAME" openxcom.app/Contents/MacOS/openxcom
          done

          SDLGFX=$(find /opt/homebrew/lib -name "libSDL_gfx*.dylib" | head -n 1)
          cp "$SDLGFX" openxcom.app/Contents/Frameworks/
          install_name_tool -change "$SDLGFX" "@executable_path/../Frameworks/$(basename $SDLGFX)" openxcom.app/Contents/MacOS/openxcom

      - name: Code sign and remove quarantine
        run: |
          cd build
          xattr -cr openxcom.app
          codesign --force --deep --sign - openxcom.app
          xattr -d com.apple.quarantine openxcom.app || true

      - name: Install create-dmg
        run: |
          brew install create-dmg

      - name: Create DMG
        run: |
          cd build
          mkdir dist
          create-dmg \
            --volname "OpenXcom Extended" \
            --window-pos 200 120 \
            --window-size 600 300 \
            --icon-size 100 \
            --icon "openxcom.app" 175 120 \
            --hide-extension "openxcom.app" \
            --app-drop-link 425 120 \
            "openxcom_${{ steps.setup.outputs.datefile }}.dmg" \
            "."

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.setup.outputs.filename }}.dmg
          path: build/openxcom_${{ steps.setup.outputs.datefile }}.dmg

name: Nightly
on:
  push:
    branches:
      - test
  workflow_dispatch:  # Allow manual trigger

jobs:
  macos:
    name: macOS (${{ matrix.arch }})
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [arm64, x86_64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup environment
        run: |
          echo "DATEFILE=`git log -1 --date=format:\"%Y_%m_%d_%H%M\" --format=\"%ad\"`" >> $GITHUB_ENV
          echo "DATEVERSION=`git log -1 --date=format:\"%Y-%m-%d %H:%M\" --format=\"%ad\"`" >> $GITHUB_ENV
          echo "CMAKE_BUILD_PARALLEL_LEVEL=`sysctl -n hw.ncpu`" >> $GITHUB_ENV
          if [[ "${{ matrix.arch }}" == "x86_64" ]]; then
            echo "ARCH_CMD=arch -x86_64" >> $GITHUB_ENV
          else
            echo "ARCH_CMD=" >> $GITHUB_ENV
          fi

      - name: Setup version info
        run: |
          sed -i '' "s/OPENXCOM_VERSION_GIT \"[^\"]*\"/OPENXCOM_VERSION_GIT \" git ${{ env.DATEVERSION }}\"/" src/version.h
          echo "FILENAME=oxce_git_${{ env.DATEFILE }}_macos_${{ matrix.arch }}" >> $GITHUB_ENV

      # Install Rosetta 2 if needed
      - name: Install Rosetta 2 (if needed)
        if: matrix.arch == 'x86_64'
        run: |
          softwareupdate --install-rosetta --agree-to-license || echo "Rosetta already installed"

      - name: Install Homebrew dependencies
        run: |
          # Setup Homebrew path based on architecture
          if [[ "${{ matrix.arch }}" == "arm64" ]]; then
            eval "$(/opt/homebrew/bin/brew shellenv || true)"
          else
            eval "$(/usr/local/bin/brew shellenv || true)"
          fi
          
          # Install dependencies
          ${{ env.ARCH_CMD }} brew update
          ${{ env.ARCH_CMD }} brew install cmake pkg-config sdl12-compat sdl_gfx yaml-cpp

      # Manually install SDL_image and SDL_mixer for SDL 1.2
      - name: Install SDL_image
        run: |
          curl -LO https://www.libsdl.org/projects/SDL_image/release/SDL_image-1.2.12.tar.gz
          tar -xzf SDL_image-1.2.12.tar.gz
          cd SDL_image-1.2.12
          
          # Use Homebrew prefix
          if [[ "${{ matrix.arch }}" == "arm64" ]]; then
            export HOMEBREW_PREFIX="/opt/homebrew"
          else
            export HOMEBREW_PREFIX="/usr/local"
          fi
          
          ${{ env.ARCH_CMD }} ./configure --prefix=${HOMEBREW_PREFIX}
          ${{ env.ARCH_CMD }} make -j$(sysctl -n hw.ncpu)
          sudo ${{ env.ARCH_CMD }} make install

      - name: Install SDL_mixer
        run: |
          curl -LO https://www.libsdl.org/projects/SDL_mixer/release/SDL_mixer-1.2.12.tar.gz
          tar -xzf SDL_mixer-1.2.12.tar.gz
          cd SDL_mixer-1.2.12
          
          # Use Homebrew prefix
          if [[ "${{ matrix.arch }}" == "arm64" ]]; then
            export HOMEBREW_PREFIX="/opt/homebrew"
          else
            export HOMEBREW_PREFIX="/usr/local"
          fi
          
          ${{ env.ARCH_CMD }} ./configure --prefix=${HOMEBREW_PREFIX}
          ${{ env.ARCH_CMD }} make -j$(sysctl -n hw.ncpu)
          sudo ${{ env.ARCH_CMD }} make install

      - name: Build OpenXcom
        run: |
          # Set Homebrew prefix for library paths
          if [[ "${{ matrix.arch }}" == "arm64" ]]; then
            export HOMEBREW_PREFIX="/opt/homebrew"
          else
            export HOMEBREW_PREFIX="/usr/local"
          fi
          
          # Build using CMake
          ${{ env.ARCH_CMD }} cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} \
            -DPKG_CONFIG_EXECUTABLE=${HOMEBREW_PREFIX}/bin/pkg-config
          
          ${{ env.ARCH_CMD }} cmake --build build --parallel $(sysctl -n hw.ncpu)

      - name: Create app bundle
        run: |
          # Create Frameworks directory
          mkdir -p build/openxcom.app/Contents/Frameworks
          
          # Determine Homebrew prefix
          if [[ "${{ matrix.arch }}" == "arm64" ]]; then
            export HOMEBREW_PREFIX="/opt/homebrew"
          else
            export HOMEBREW_PREFIX="/usr/local"
          fi
          
          # Copy required libraries
          # SDL
          cp ${HOMEBREW_PREFIX}/lib/libSDL*.dylib build/openxcom.app/Contents/Frameworks/
          # SDL_image
          cp ${HOMEBREW_PREFIX}/lib/libSDL_image*.dylib build/openxcom.app/Contents/Frameworks/
          # SDL_mixer
          cp ${HOMEBREW_PREFIX}/lib/libSDL_mixer*.dylib build/openxcom.app/Contents/Frameworks/
          # SDL_gfx
          cp ${HOMEBREW_PREFIX}/lib/libSDL_gfx*.dylib build/openxcom.app/Contents/Frameworks/
          # YAML
          cp ${HOMEBREW_PREFIX}/lib/libyaml-cpp*.dylib build/openxcom.app/Contents/Frameworks/
          # zlib (critical)
          cp /usr/lib/libz.1.dylib build/openxcom.app/Contents/Frameworks/ || true
          cp ${HOMEBREW_PREFIX}/opt/zlib/lib/libz.1.dylib build/openxcom.app/Contents/Frameworks/ || true
          
          # Add @rpath to executable
          install_name_tool -add_rpath @executable_path/../Frameworks build/openxcom.app/Contents/MacOS/openxcom
          
          # Fix zlib reference specifically
          install_name_tool -change "/usr/lib/libz.1.dylib" "@rpath/libz.1.dylib" build/openxcom.app/Contents/MacOS/openxcom || true
          
          # Remove code signature attributes and sign the app
          sudo xattr -cr build/openxcom.app
          codesign --force --deep --sign - build/openxcom.app

      - name: Package app
        run: |
          mkdir -p artifacts
          cd build
          zip -r ../artifacts/${{ env.FILENAME }}.zip openxcom.app

      - name: Get SHA hashes
        uses: nrwl/nx-set-shas@v4
        with:
          main-branch-name: test

      - name: Generate build log
        run: |
          git log --pretty=format:"<strong>%an, %ad</strong>%n%B" -n 10 --date=iso-local ${{ env.NX_BASE }}..${{ env.NX_HEAD }} > artifacts/${{ env.FILENAME }}.log

      - name: Archive artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FILENAME }}
          path: artifacts/*

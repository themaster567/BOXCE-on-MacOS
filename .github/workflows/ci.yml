name: CI Build for macOS (x86_64 and arm64)

on:
  push:  # Automatically triggered for pushes
  pull_request:  # Automatically triggered for pull requests
  workflow_dispatch:  # Manually triggered via the GitHub Actions UI

jobs:
  build:
    name: Build on macOS ${{ matrix.arch }}

    strategy:
      fail-fast: false
      matrix:
        os: [macOS-latest]
        arch: [arm64, x86_64]  # Support both architectures (Apple Silicon + Rosetta for x86_64)

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Install Rosetta 2 if running on Apple Silicon and building for x86_64
      - name: Install Rosetta 2 (if needed for x86_64)
        if: runner.os == 'macOS' && matrix.arch == 'x86_64'
        run: |
          softwareupdate --install-rosetta --agree-to-license || echo "Rosetta 2 already installed"

      - name: Set architecture for build
        run: |
          if [[ "${{ matrix.arch }}" == "x86_64" ]]; then
            export ARCH_CMD="arch -x86_64"
          else
            export ARCH_CMD=""
          fi
          echo "ARCH_CMD=$ARCH_CMD" >> $GITHUB_ENV

      - name: Install Homebrew
        run: |
          NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          if [[ "${{ matrix.arch }}" == "arm64" ]]; then
            eval "$(/opt/homebrew/bin/brew shellenv)"  # Apple Silicon Homebrew path
          else
            eval "$(/usr/local/bin/brew shellenv)"    # x86_64 Homebrew path (via Rosetta)
          fi
          echo "HOMEBREW_PREFIX=$(brew --prefix)" >> $GITHUB_ENV

      - name: Install dependencies with Homebrew
        run: |
          ${{ env.ARCH_CMD }} brew install cmake pkg-config sdl12-compat sdl_gfx yaml-cpp ccache zlib

      # Manually download and build SDL_image using autotools
      - name: Download and install SDL_image
        run: |
          curl -LO https://www.libsdl.org/projects/SDL_image/release/SDL_image-1.2.12.tar.gz
          tar -xzf SDL_image-1.2.12.tar.gz
          cd SDL_image-1.2.12
          ${{ env.ARCH_CMD }} ./configure --prefix=${{ env.HOMEBREW_PREFIX }}/sdl12-compat  # Ensure SDL is found and installed in the correct path
          ${{ env.ARCH_CMD }} make -j$(sysctl -n hw.ncpu)
          sudo ${{ env.ARCH_CMD }} make install  # Install system-wide

      # Manually download and build SDL_mixer using autotools
      - name: Download and install SDL_mixer
        run: |
          curl -LO https://www.libsdl.org/projects/SDL_mixer/release/SDL_mixer-1.2.12.tar.gz
          tar -xzf SDL_mixer-1.2.12.tar.gz
          cd SDL_mixer-1.2.12
          ${{ env.ARCH_CMD }} ./configure --prefix=${{ env.HOMEBREW_PREFIX }}/sdl12-compat  # Ensure SDL is found and installed in the correct path
          ${{ env.ARCH_CMD }} make -j$(sysctl -n hw.ncpu)
          sudo ${{ env.ARCH_CMD }} make install  # Install system-wide

      - name: Ensure pkg-config can find SDL dependencies
        run: |
          export PKG_CONFIG_PATH=${{ env.HOMEBREW_PREFIX }}/sdl12-compat/lib/pkgconfig:$PKG_CONFIG_PATH
          echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH" >> $GITHUB_ENV

      - name: Generate project files with CMake
        run: |
          ${{ env.ARCH_CMD }} cmake -B build -DCMAKE_BUILD_TYPE=Release -DPKG_CONFIG_EXECUTABLE=${{ env.HOMEBREW_PREFIX }}/bin/pkg-config -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }}

      - name: Build the project
        run: |
          ${{ env.ARCH_CMD }} cmake --build build --parallel $(( $(sysctl -n hw.ncpu) - 1 ))

      - name: Find library dependencies
        run: |
          # Create a list of all libraries the executable depends on
          LIBS_NEEDED=$(otool -L build/openxcom.app/Contents/MacOS/openxcom | grep -v '@executable_path' | grep -v '/System/' | grep -v '/usr/lib/' | awk '{print $1}')
          echo "Libraries needed:"
          echo "$LIBS_NEEDED"
          echo "LIBS_NEEDED<<EOF" >> $GITHUB_ENV
          echo "$LIBS_NEEDED" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Prepare app bundle
        run: |
          # Create Frameworks directory
          mkdir -p build/openxcom.app/Contents/Frameworks/
          
          # Copy all required libraries
          # Add system compression library (zlib) - this was missing previously
          cp ${{ env.HOMEBREW_PREFIX }}/opt/zlib/lib/libz.1.dylib build/openxcom.app/Contents/Frameworks/ || true
          
          # SDL (SDL12-compat is SDL1.2 compatibility layer built on SDL2)
          cp ${{ env.HOMEBREW_PREFIX }}/lib/libSDL-*dylib build/openxcom.app/Contents/Frameworks/
          cp ${{ env.HOMEBREW_PREFIX }}/lib/libSDL2*dylib build/openxcom.app/Contents/Frameworks/
          
          # SDL_image
          cp ${{ env.HOMEBREW_PREFIX }}/sdl12-compat/lib/libSDL_image*dylib build/openxcom.app/Contents/Frameworks/
          
          # SDL_mixer
          cp ${{ env.HOMEBREW_PREFIX }}/sdl12-compat/lib/libSDL_mixer*dylib build/openxcom.app/Contents/Frameworks/
          
          # SDL_gfx
          cp ${{ env.HOMEBREW_PREFIX }}/lib/libSDL_gfx*dylib build/openxcom.app/Contents/Frameworks/
          
          # YAML-CPP
          cp ${{ env.HOMEBREW_PREFIX }}/lib/libyaml-cpp*dylib build/openxcom.app/Contents/Frameworks/
          
          # Copy all libraries from /usr/lib that might be needed and aren't part of the base system
          cp /usr/lib/libz.1.dylib build/openxcom.app/Contents/Frameworks/ || true
          cp /usr/lib/libpng*dylib build/openxcom.app/Contents/Frameworks/ || true
          cp /usr/lib/libjpeg*dylib build/openxcom.app/Contents/Frameworks/ || true
          
          # Copy image format libraries that SDL_image might need
          cp ${{ env.HOMEBREW_PREFIX }}/lib/libjpeg*dylib build/openxcom.app/Contents/Frameworks/ || true
          cp ${{ env.HOMEBREW_PREFIX }}/lib/libpng*dylib build/openxcom.app/Contents/Frameworks/ || true
          cp ${{ env.HOMEBREW_PREFIX }}/lib/libtiff*dylib build/openxcom.app/Contents/Frameworks/ || true
          cp ${{ env.HOMEBREW_PREFIX }}/lib/libwebp*dylib build/openxcom.app/Contents/Frameworks/ || true
          
          # Copy audio format libraries that SDL_mixer might need
          cp ${{ env.HOMEBREW_PREFIX }}/lib/libvorbis*dylib build/openxcom.app/Contents/Frameworks/ || true
          cp ${{ env.HOMEBREW_PREFIX }}/lib/libogg*dylib build/openxcom.app/Contents/Frameworks/ || true
          cp ${{ env.HOMEBREW_PREFIX }}/lib/libFLAC*dylib build/openxcom.app/Contents/Frameworks/ || true
          cp ${{ env.HOMEBREW_PREFIX }}/lib/libmodplug*dylib build/openxcom.app/Contents/Frameworks/ || true
          cp ${{ env.HOMEBREW_PREFIX }}/lib/libmpg123*dylib build/openxcom.app/Contents/Frameworks/ || true
          
          # Copy any additional libraries that might be needed
          for lib in ${{ env.LIBS_NEEDED }}; do
            base_name=$(basename "$lib")
            find ${{ env.HOMEBREW_PREFIX }} -name "$base_name" -exec cp {} build/openxcom.app/Contents/Frameworks/ \; || true
          done
          
          # List all copied libraries for debugging
          echo "Files in Frameworks directory:"
          ls -la build/openxcom.app/Contents/Frameworks/

      - name: Remove code signatures from libraries
        run: |
          # First remove any existing code signatures from libraries
          sudo xattr -cr build/openxcom.app/Contents/Frameworks/*.dylib
          # Remove signatures from executable as well
          sudo xattr -cr build/openxcom.app/Contents/MacOS/openxcom

      - name: Fix library paths with install_name_tool
        run: |
          cd build/openxcom.app/Contents/Frameworks/
          
          # Use otool to find dependencies and fix them
          for lib in *.dylib; do
            echo "Processing $lib..."
            
            # Get the install name of the library
            INSTALL_NAME=$(otool -D "$lib" | tail -n 1)
            
            # Fix the ID of the library to use @rpath
            install_name_tool -id "@rpath/$(basename $lib)" "$lib" || echo "Failed to change ID for $lib"
            
            # Get the dependencies of the library
            DEPS=$(otool -L "$lib" | tail -n +2 | awk '{print $1}' | grep -v '@rpath' | grep -v '/System/' | grep -v '/usr/lib/')
            
            # Fix each dependency
            for dep in $DEPS; do
              # If the dependency is from Homebrew or is one of our libraries
              BASE_NAME=$(basename "$dep")
              # Change the path to use @rpath
              install_name_tool -change "$dep" "@rpath/$BASE_NAME" "$lib" || echo "Failed to change $dep in $lib"
            done
          done
          
          # Fix the main executable as well
          cd ../MacOS
          MAIN_EXE="openxcom"
          
          # Get all dependencies that need to be fixed
          DEPS=$(otool -L "$MAIN_EXE" | tail -n +2 | awk '{print $1}' | grep -v '@rpath' | grep -v '/System/' | grep -v '/usr/lib/')
          
          # Fix each dependency
          for dep in $DEPS; do
            BASE_NAME=$(basename "$dep")
            # Change the path to use @rpath
            install_name_tool -change "$dep" "@rpath/$BASE_NAME" "$MAIN_EXE" || echo "Failed to change $dep in $MAIN_EXE"
          done
          
          # Fix libz.1.dylib specifically, which is a system library but needs to be bundled
          if otool -L "$MAIN_EXE" | grep -q '/usr/lib/libz.1.dylib'; then
            install_name_tool -change "/usr/lib/libz.1.dylib" "@rpath/libz.1.dylib" "$MAIN_EXE" || echo "Failed to change libz.1.dylib in $MAIN_EXE"
          fi

      - name: Add rpaths and finalize app
        run: |
          # Add @rpath to the binary
          install_name_tool -add_rpath @executable_path/../Frameworks build/openxcom.app/Contents/MacOS/openxcom || echo "Failed to add rpath"
          
          # Also add system paths as fallbacks
          install_name_tool -add_rpath /usr/lib build/openxcom.app/Contents/MacOS/openxcom || echo "Failed to add /usr/lib rpath"
          install_name_tool -add_rpath ${{ env.HOMEBREW_PREFIX }}/lib build/openxcom.app/Contents/MacOS/openxcom || echo "Failed to add Homebrew lib rpath"
          
          # Check all dependencies
          echo "Final executable dependencies:"
          otool -L build/openxcom.app/Contents/MacOS/openxcom
          
          # Sign the app
          codesign --force --deep --sign - build/openxcom.app
          
          # Package the app
          cd build
          zip -r openxcom.zip openxcom.app

      - name: Archive built artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openxcom_${{ matrix.arch }}
          path: build/openxcom.zip

      - name: ccache stats
        run: ccache -s --max-size=390MB

name: CI Build for macOS (x86_64 and arm64)

on:
  push:  # Automatically triggered for pushes
  pull_request:  # Automatically triggered for pull requests
  workflow_dispatch:  # Manually triggered via the GitHub Actions UI

jobs:
  build:
    name: Build on macOS ${{ matrix.arch }}

    strategy:
      fail-fast: false
      matrix:
        os: [macOS-latest]
        arch: [arm64, x86_64]  # Support both architectures (Apple Silicon + Rosetta for x86_64)

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Install Rosetta 2 if running on Apple Silicon and building for x86_64
      - name: Install Rosetta 2 (if needed for x86_64)
        if: runner.os == 'macOS' && matrix.arch == 'x86_64'
        run: |
          softwareupdate --install-rosetta --agree-to-license || echo "Rosetta 2 already installed"

      - name: Set architecture for build
        run: |
          if [[ "${{ matrix.arch }}" == "x86_64" ]]; then
            export ARCH_CMD="arch -x86_64"
          else
            export ARCH_CMD=""
          fi
          echo "ARCH_CMD=$ARCH_CMD" >> $GITHUB_ENV

      - name: Install Homebrew
        run: |
          NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          if [[ "${{ matrix.arch }}" == "arm64" ]]; then
            eval "$(/opt/homebrew/bin/brew shellenv)"  # Apple Silicon Homebrew path
          else
            eval "$(/usr/local/bin/brew shellenv)"    # x86_64 Homebrew path (via Rosetta)
          fi
          echo "HOMEBREW_PREFIX=$(brew --prefix)" >> $GITHUB_ENV

      - name: Install dependencies with Homebrew
        run: |
          ${{ env.ARCH_CMD }} brew install cmake pkg-config sdl12-compat sdl_gfx yaml-cpp ccache zlib

      # Manually download and build SDL_image using autotools
      - name: Download and install SDL_image
        run: |
          curl -LO https://www.libsdl.org/projects/SDL_image/release/SDL_image-1.2.12.tar.gz
          tar -xzf SDL_image-1.2.12.tar.gz
          cd SDL_image-1.2.12
          ${{ env.ARCH_CMD }} ./configure --prefix=${{ env.HOMEBREW_PREFIX }}/sdl12-compat  # Ensure SDL is found and installed in the correct path
          ${{ env.ARCH_CMD }} make -j$(sysctl -n hw.ncpu)
          sudo ${{ env.ARCH_CMD }} make install  # Install system-wide

      # Manually download and build SDL_mixer using autotools
      - name: Download and install SDL_mixer
        run: |
          curl -LO https://www.libsdl.org/projects/SDL_mixer/release/SDL_mixer-1.2.12.tar.gz
          tar -xzf SDL_mixer-1.2.12.tar.gz
          cd SDL_mixer-1.2.12
          ${{ env.ARCH_CMD }} ./configure --prefix=${{ env.HOMEBREW_PREFIX }}/sdl12-compat  # Ensure SDL is found and installed in the correct path
          ${{ env.ARCH_CMD }} make -j$(sysctl -n hw.ncpu)
          sudo ${{ env.ARCH_CMD }} make install  # Install system-wide

      - name: Ensure pkg-config can find SDL dependencies
        run: |
          export PKG_CONFIG_PATH=${{ env.HOMEBREW_PREFIX }}/sdl12-compat/lib/pkgconfig:$PKG_CONFIG_PATH
          echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH" >> $GITHUB_ENV

      - name: Generate project files with CMake
        run: |
          ${{ env.ARCH_CMD }} cmake -B build -DCMAKE_BUILD_TYPE=Release -DPKG_CONFIG_EXECUTABLE=${{ env.HOMEBREW_PREFIX }}/bin/pkg-config -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }}

      - name: Build the project
        run: |
          ${{ env.ARCH_CMD }} cmake --build build --parallel $(( $(sysctl -n hw.ncpu) - 1 ))

      - name: Create macOS app bundle with all dependencies
        run: |
          # Create directory for dependencies
          mkdir -p build/Dependencies
          
          # Use dylibbundler to copy and fix all dependencies
          brew install dylibbundler
          
          # Copy executable to a working location for dylibbundler
          cp build/openxcom.app/Contents/MacOS/openxcom build/openxcom-exec
          
          # Run dylibbundler to collect all dependencies
          dylibbundler -x build/openxcom-exec -b -d build/Dependencies -p @executable_path/../Frameworks/
          
          # Create Frameworks directory
          mkdir -p build/openxcom.app/Contents/Frameworks/
          
          # Copy all collected dependencies to the Frameworks directory
          cp build/Dependencies/* build/openxcom.app/Contents/Frameworks/
          
          # Copy zlib specifically (which was identified as missing)
          cp ${{ env.HOMEBREW_PREFIX }}/opt/zlib/lib/libz.1.dylib build/openxcom.app/Contents/Frameworks/ || true
          cp /usr/lib/libz.1.dylib build/openxcom.app/Contents/Frameworks/ || true
          
          # Fix the main executable to use @rpath for zlib
          install_name_tool -change "/usr/lib/libz.1.dylib" "@rpath/libz.1.dylib" build/openxcom.app/Contents/MacOS/openxcom || true
          
          # Add @rpath to the executable
          install_name_tool -add_rpath @executable_path/../Frameworks build/openxcom.app/Contents/MacOS/openxcom || true
          
          # Copy SDL libraries explicitly - these are critical
          cp ${{ env.HOMEBREW_PREFIX }}/lib/libSDL-1.2.0.dylib build/openxcom.app/Contents/Frameworks/ || true
          cp ${{ env.HOMEBREW_PREFIX }}/lib/libSDL2-2.0.0.dylib build/openxcom.app/Contents/Frameworks/ || true
          cp ${{ env.HOMEBREW_PREFIX }}/sdl12-compat/lib/libSDL_image-1.2.0.dylib build/openxcom.app/Contents/Frameworks/ || true
          cp ${{ env.HOMEBREW_PREFIX }}/sdl12-compat/lib/libSDL_mixer-1.2.0.dylib build/openxcom.app/Contents/Frameworks/ || true
          cp ${{ env.HOMEBREW_PREFIX }}/lib/libSDL_gfx.15.dylib build/openxcom.app/Contents/Frameworks/ || true
          cp ${{ env.HOMEBREW_PREFIX }}/lib/libyaml-cpp.0.7.dylib build/openxcom.app/Contents/Frameworks/ || true
          
          # Fix the library IDs
          for lib in build/openxcom.app/Contents/Frameworks/*.dylib; do
            install_name_tool -id "@rpath/$(basename $lib)" "$lib" || true
          done
          
          # Print what libraries were bundled
          echo "Bundled libraries:"
          ls -la build/openxcom.app/Contents/Frameworks/

      - name: Fix, sign, and package the app
        run: |
          # Fix extended attributes and sign
          sudo xattr -cr build/openxcom.app
          codesign --force --deep --sign - build/openxcom.app
          
          # Package the app
          cd build
          zip -r openxcom.zip openxcom.app

      - name: Archive built artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openxcom_${{ matrix.arch }}
          path: build/openxcom.zip

      - name: ccache stats
        run: ccache -s --max-size=390MB

name: CI Build for macOS (x86_64 and arm64)

on:
  push:  # Automatically triggered for all pushes
  pull_request:  # Automatically triggered for pull requests
  workflow_dispatch:  # Manually triggered

jobs:
  macos:
    name: macOS (${{ matrix.arch }})
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup environment
        run: |
          echo "DATEFILE=`git log -1 --date=format:\"%Y_%m_%d_%H%M\" --format=\"%ad\"`" >> $GITHUB_ENV
          echo "DATEVERSION=`git log -1 --date=format:\"%Y-%m-%d %H:%M\" --format=\"%ad\"`" >> $GITHUB_ENV
          if [[ "${{ matrix.arch }}" == "x86_64" ]]; then
            echo "ARCH_CMD=arch -x86_64" >> $GITHUB_ENV
          else
            echo "ARCH_CMD=" >> $GITHUB_ENV
          fi
          
          # Set Homebrew prefix based on architecture
          if [[ "${{ matrix.arch }}" == "arm64" ]]; then
            echo "HOMEBREW_PREFIX=/opt/homebrew" >> $GITHUB_ENV
          else
            echo "HOMEBREW_PREFIX=/usr/local" >> $GITHUB_ENV
          fi

      - name: Setup version info
        run: |
          sed -i '' "s/OPENXCOM_VERSION_GIT \"[^\"]*\"/OPENXCOM_VERSION_GIT \" git ${{ env.DATEVERSION }}\"/" src/version.h
          echo "FILENAME=openxcom_${{ env.DATEFILE }}_macos_${{ matrix.arch }}" >> $GITHUB_ENV

      # Install Rosetta 2 if needed
      - name: Install Rosetta 2 (if needed)
        if: matrix.arch == 'x86_64'
        run: |
          softwareupdate --install-rosetta --agree-to-license || echo "Rosetta already installed"

      - name: Install Homebrew dependencies
        run: |
          # Setup Homebrew path
          if [[ "${{ matrix.arch }}" == "arm64" ]]; then
            eval "$(/opt/homebrew/bin/brew shellenv || true)"
          else
            eval "$(/usr/local/bin/brew shellenv || true)"
          fi
          
          # Install dependencies with formula flag to avoid warnings
          ${{ env.ARCH_CMD }} brew update
          ${{ env.ARCH_CMD }} brew install --formula cmake pkg-config sdl12-compat sdl_gfx yaml-cpp zlib || true

      # Manually install SDL_image and SDL_mixer for SDL 1.2
      - name: Install SDL_image
        run: |
          curl -LO https://www.libsdl.org/projects/SDL_image/release/SDL_image-1.2.12.tar.gz
          tar -xzf SDL_image-1.2.12.tar.gz
          cd SDL_image-1.2.12
          ${{ env.ARCH_CMD }} ./configure --prefix=${{ env.HOMEBREW_PREFIX }}
          ${{ env.ARCH_CMD }} make -j$(sysctl -n hw.ncpu)
          sudo ${{ env.ARCH_CMD }} make install

      - name: Install SDL_mixer
        run: |
          curl -LO https://www.libsdl.org/projects/SDL_mixer/release/SDL_mixer-1.2.12.tar.gz
          tar -xzf SDL_mixer-1.2.12.tar.gz
          cd SDL_mixer-1.2.12
          ${{ env.ARCH_CMD }} ./configure --prefix=${{ env.HOMEBREW_PREFIX }}
          ${{ env.ARCH_CMD }} make -j$(sysctl -n hw.ncpu)
          sudo ${{ env.ARCH_CMD }} make install

      - name: Configure CMake
        run: |
          ${{ env.ARCH_CMD }} cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} \
            -DPKG_CONFIG_EXECUTABLE=${{ env.HOMEBREW_PREFIX }}/bin/pkg-config \
            -DCMAKE_CXX_FLAGS="-Wno-dangling-else -Wno-unused-variable"

      - name: Build OpenXcom
        run: |
          ${{ env.ARCH_CMD }} cmake --build build --parallel $(sysctl -n hw.ncpu)

      - name: Create app bundle with proper permissions
        run: |
          # Create Frameworks directory with proper permissions
          sudo mkdir -p build/openxcom.app/Contents/Frameworks
          sudo chmod 755 build/openxcom.app/Contents/Frameworks
          
          # Use sudo for copying to avoid permission issues
          echo "Copying SDL libraries..."
          sudo cp ${{ env.HOMEBREW_PREFIX }}/lib/libSDL*.dylib build/openxcom.app/Contents/Frameworks/ || echo "Some SDL libraries may not have been found"
          
          echo "Copying SDL_image library..."
          sudo cp ${{ env.HOMEBREW_PREFIX }}/lib/libSDL_image*.dylib build/openxcom.app/Contents/Frameworks/ || echo "SDL_image library may not have been found"
          
          echo "Copying SDL_mixer library..."
          sudo cp ${{ env.HOMEBREW_PREFIX }}/lib/libSDL_mixer*.dylib build/openxcom.app/Contents/Frameworks/ || echo "SDL_mixer library may not have been found"
          
          echo "Copying SDL_gfx library..."
          sudo find ${{ env.HOMEBREW_PREFIX }}/lib -name "libSDL_gfx*dylib" -exec cp {} build/openxcom.app/Contents/Frameworks/ \; || echo "SDL_gfx library may not have been found"
          
          echo "Copying YAML-CPP library..."
          sudo cp ${{ env.HOMEBREW_PREFIX }}/lib/libyaml-cpp*.dylib build/openxcom.app/Contents/Frameworks/ || echo "YAML-CPP library may not have been found"
          
          echo "Copying zlib library..."
          sudo cp /usr/lib/libz.1.dylib build/openxcom.app/Contents/Frameworks/ || echo "System zlib library may not have been found"
          sudo cp ${{ env.HOMEBREW_PREFIX }}/opt/zlib/lib/libz.1.dylib build/openxcom.app/Contents/Frameworks/ || echo "Homebrew zlib library may not have been found"
          
          # Check if libraries were successfully copied
          echo "Listing bundled libraries:"
          ls -la build/openxcom.app/Contents/Frameworks/
          
          # Make sure all files have proper permissions
          sudo chmod 755 build/openxcom.app/Contents/Frameworks/*.dylib
          
          # Add @rpath to executable
          sudo install_name_tool -add_rpath @executable_path/../Frameworks build/openxcom.app/Contents/MacOS/openxcom
          
          # Fix zlib reference specifically
          sudo install_name_tool -change "/usr/lib/libz.1.dylib" "@rpath/libz.1.dylib" build/openxcom.app/Contents/MacOS/openxcom || true
          
          # Ensure the entire app bundle has proper permissions
          sudo chmod -R 755 build/openxcom.app
          sudo chown -R $(whoami) build/openxcom.app
          
          # Remove code signature attributes and sign the app
          sudo xattr -cr build/openxcom.app
          codesign --force --deep --sign - build/openxcom.app

      - name: Package app
        run: |
          mkdir -p artifacts
          cd build
          zip -r ../artifacts/${{ env.FILENAME }}.zip openxcom.app

      - name: Archive artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FILENAME }}
          path: artifacts/*

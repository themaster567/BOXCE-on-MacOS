name: Universal macOS Build

on:
  push:
    branches: [ '**' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        arch: [arm64, x86_64]
    runs-on: macos-14
    name: Build ${{ matrix.arch }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup environment
        id: setup
        run: |
          DATE=$(git log -1 --date=format:'%Y_%m_%d_%H%M' --format='%ad')
          DATE_HUMAN=$(git log -1 --date=format:'%Y-%m-%d %H:%M' --format='%ad')
          echo "datefile=$DATE" >> $GITHUB_OUTPUT
          echo "dateversion=$DATE_HUMAN" >> $GITHUB_OUTPUT
          echo "archdir=build-${{ matrix.arch }}" >> $GITHUB_OUTPUT
          echo "filename=openxcom_${DATE}_macos" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: |
          brew update
          brew install cmake pkg-config sdl12-compat sdl_gfx yaml-cpp zlib dylibbundler ccache

      - name: Build SDL_image 1.2.12
        run: |
          curl -LO https://www.libsdl.org/projects/SDL_image/release/SDL_image-1.2.12.tar.gz
          tar -xzf SDL_image-1.2.12.tar.gz
          cd SDL_image-1.2.12
          ./configure --prefix=/opt/homebrew
          make -j$(sysctl -n hw.ncpu)
          sudo make install

      - name: Build SDL_mixer 1.2.12
        run: |
          curl -LO https://www.libsdl.org/projects/SDL_mixer/release/SDL_mixer-1.2.12.tar.gz
          tar -xzf SDL_mixer-1.2.12.tar.gz
          cd SDL_mixer-1.2.12
          ./configure --prefix=/opt/homebrew
          make -j$(sysctl -n hw.ncpu)
          sudo make install

      - name: Set environment
        run: |
          echo "LDFLAGS=-L/opt/homebrew/opt/zlib/lib" >> $GITHUB_ENV
          echo "CPPFLAGS=-I/opt/homebrew/opt/zlib/include" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=/opt/homebrew/lib/pkgconfig" >> $GITHUB_ENV
          echo "CMAKE_C_COMPILER_LAUNCHER=ccache" >> $GITHUB_ENV
          echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache" >> $GITHUB_ENV

      - name: Update version.h
        run: |
          sed -i '' 's/OPENXCOM_VERSION_GIT ".*"/OPENXCOM_VERSION_GIT " git ${{ steps.setup.outputs.dateversion }}"/' src/version.h

      - name: Configure and build OXCE
        env:
          LDFLAGS: ${{ env.LDFLAGS }}
          CPPFLAGS: ${{ env.CPPFLAGS }}
          PKG_CONFIG_PATH: ${{ env.PKG_CONFIG_PATH }}
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: |
          mkdir ${{ steps.setup.outputs.archdir }}
          cd ${{ steps.setup.outputs.archdir }}
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.9 \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} \
            -DBUILD_TESTING=OFF \
            -DDOXYGEN_FOUND=FALSE
          make -j$(sysctl -n hw.ncpu)

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: oxce-macos-${{ matrix.arch }}
          path: ${{ steps.setup.outputs.archdir }}/openxcom.app/Contents/MacOS/openxcom

  merge:
    needs: build
    runs-on: macos-14
    name: Merge and Package Universal Binary

    steps:
      - uses: actions/checkout@v4

      - name: Setup
        id: setup
        run: |
          DATE=$(git log -1 --date=format:'%Y_%m_%d_%H%M' --format='%ad')
          echo "datefile=$DATE" >> $GITHUB_OUTPUT
          echo "filename=openxcom_${DATE}_macos_universal" >> $GITHUB_OUTPUT

      - name: Download ARM64 binary
        uses: actions/download-artifact@v4
        with:
          name: oxce-macos-arm64
          path: bin-arm64

      - name: Download x86_64 binary
        uses: actions/download-artifact@v4
        with:
          name: oxce-macos-x86_64
          path: bin-x86_64

      - name: Merge binaries with lipo
        run: |
          mkdir -p universal/openxcom.app/Contents/MacOS
          lipo -create bin-arm64/openxcom bin-x86_64/openxcom \
            -output universal/openxcom.app/Contents/MacOS/openxcom
          chmod +x universal/openxcom.app/Contents/MacOS/openxcom

      - name: Copy .app resources
        run: |
          cp -R bin-arm64/../* universal/openxcom.app/
          rm -f universal/openxcom.app/Contents/MacOS/openxcom
          cp bin-arm64/openxcom universal/openxcom.app/Contents/MacOS/openxcom

      - name: Bundle libraries
        run: |
          cd universal
          dylibbundler -od -b -x openxcom.app/Contents/MacOS/openxcom \
            -d openxcom.app/Contents/Frameworks \
            -p @executable_path/../Frameworks/
          install_name_tool -add_rpath @executable_path/../Frameworks openxcom.app/Contents/MacOS/openxcom

      - name: Code sign
        run: |
          cd universal
          xattr -cr openxcom.app
          codesign --force --deep --sign - openxcom.app

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Create DMG
        run: |
          cd universal
          create-dmg \
            --volname "OpenXcom Extended" \
            --window-pos 200 120 \
            --window-size 600 300 \
            --icon-size 100 \
            --icon "openxcom.app" 175 120 \
            --hide-extension "openxcom.app" \
            --app-drop-link 425 120 \
            "../${{ steps.setup.outputs.filename }}.dmg" \
            "."

      - name: Generate changelog
        id: changelog
        run: |
          git fetch --tags
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then
            LOG=$(git log "$LAST_TAG"..HEAD --pretty=format:"- %s")
          else
            LOG=$(git log --pretty=format:"- %s" -n 20)
          fi
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$LOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          name: OpenXcom Extended ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.changelog }}
          files: ${{ steps.setup.outputs.filename }}.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

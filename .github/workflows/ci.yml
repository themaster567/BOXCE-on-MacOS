  macos:
    name: macOS ARM64
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup build environment
        run: |
          echo "DATEFILE=$(git log -1 --date=format:'%Y_%m_%d_%H%M' --format='%ad')" >> $GITHUB_ENV
          echo "DATEVERSION=$(git log -1 --date=format:'%Y-%m-%d %H:%M' --format='%ad')" >> $GITHUB_ENV
          echo "FILENAME=openxcom_${{ env.DATEFILE }}_macos_arm64" >> $GITHUB_ENV
          echo "HOMEBREW_PREFIX=/opt/homebrew" >> $GITHUB_ENV
          echo "ARCH_CMD=" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          eval "$(${HOMEBREW_PREFIX}/bin/brew shellenv)"
          brew update
          brew install cmake pkg-config sdl2 sdl2_image sdl2_mixer sdl2_gfx yaml-cpp zlib dylibbundler

      - name: Set zlib paths for Sonoma
        run: |
          echo "LDFLAGS=-L${HOMEBREW_PREFIX}/opt/zlib/lib" >> $GITHUB_ENV
          echo "CPPFLAGS=-I${HOMEBREW_PREFIX}/opt/zlib/include" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=${HOMEBREW_PREFIX}/opt/zlib/lib/pkgconfig" >> $GITHUB_ENV

      - name: Configure and build with CMake
        env:
          LDFLAGS: ${{ env.LDFLAGS }}
          CPPFLAGS: ${{ env.CPPFLAGS }}
          PKG_CONFIG_PATH: ${{ env.PKG_CONFIG_PATH }}
        run: |
          mkdir build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release \
                   -DCMAKE_OSX_DEPLOYMENT_TARGET=10.9 \
                   -DCMAKE_OSX_ARCHITECTURES=arm64
          make -j$(sysctl -n hw.ncpu)

      - name: Bundle dependencies
        run: |
          cd build
          mkdir -p openxcom.app/Contents/Frameworks
          dylibbundler -od -b -x openxcom.app/Contents/MacOS/openxcom \
            -d openxcom.app/Contents/Frameworks \
            -p @executable_path/../Frameworks/

          # Add rpath to find local Frameworks
          install_name_tool -add_rpath @executable_path/../Frameworks openxcom.app/Contents/MacOS/openxcom

          # Sign app for macOS Gatekeeper
          xattr -cr openxcom.app
          codesign --force --deep --sign - openxcom.app

      - name: Create README
        run: |
          cat > build/README.txt << 'EOL'
          OpenXcom Extended - macOS ARM64 Build

          To run the game:
          - Move openxcom.app to /Applications or another folder
          - Right-click > Open once to bypass Apple security warning
          - Or: xattr -d com.apple.quarantine /path/to/openxcom.app
          EOL

      - name: Package build
        run: |
          cd build
          zip -r "${{ env.FILENAME }}.zip" openxcom.app README.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FILENAME }}
          path: build/${{ env.FILENAME }}.zip

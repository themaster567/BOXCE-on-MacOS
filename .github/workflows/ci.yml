name: CI Build for macOS (x86_64 and arm64)

on:
  push:  # Automatically triggered for all pushes
  pull_request:  # Automatically triggered for pull requests
  workflow_dispatch:  # Manually triggered

jobs:
  macos:
    name: macOS (${{ matrix.arch }})
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup environment
        run: |
          echo "DATEFILE=`git log -1 --date=format:\"%Y_%m_%d_%H%M\" --format=\"%ad\"`" >> $GITHUB_ENV
          echo "DATEVERSION=`git log -1 --date=format:\"%Y-%m-%d %H:%M\" --format=\"%ad\"`" >> $GITHUB_ENV
          if [[ "${{ matrix.arch }}" == "x86_64" ]]; then
            echo "ARCH_CMD=arch -x86_64" >> $GITHUB_ENV
          else
            echo "ARCH_CMD=" >> $GITHUB_ENV
          fi
          
          # Set Homebrew prefix based on architecture
          if [[ "${{ matrix.arch }}" == "arm64" ]]; then
            echo "HOMEBREW_PREFIX=/opt/homebrew" >> $GITHUB_ENV
          else
            echo "HOMEBREW_PREFIX=/usr/local" >> $GITHUB_ENV
          fi

      - name: Setup version info
        run: |
          sed -i '' "s/OPENXCOM_VERSION_GIT \"[^\"]*\"/OPENXCOM_VERSION_GIT \" git ${{ env.DATEVERSION }}\"/" src/version.h
          echo "FILENAME=openxcom_${{ env.DATEFILE }}_macos_${{ matrix.arch }}" >> $GITHUB_ENV

      # Install Rosetta 2 if needed
      - name: Install Rosetta 2 (if needed)
        if: matrix.arch == 'x86_64'
        run: |
          softwareupdate --install-rosetta --agree-to-license || echo "Rosetta already installed"

      - name: Install Homebrew dependencies
        run: |
          # Setup Homebrew path
          if [[ "${{ matrix.arch }}" == "arm64" ]]; then
            eval "$(/opt/homebrew/bin/brew shellenv || true)"
          else
            eval "$(/usr/local/bin/brew shellenv || true)"
          fi
          
          # Install dependencies with formula flag to avoid warnings
          ${{ env.ARCH_CMD }} brew update
          ${{ env.ARCH_CMD }} brew install --formula cmake pkg-config sdl12-compat sdl_gfx yaml-cpp zlib dylibbundler || true

      # Manually install SDL_image and SDL_mixer for SDL 1.2
      - name: Install SDL_image
        run: |
          curl -LO https://www.libsdl.org/projects/SDL_image/release/SDL_image-1.2.12.tar.gz
          tar -xzf SDL_image-1.2.12.tar.gz
          cd SDL_image-1.2.12
          ${{ env.ARCH_CMD }} ./configure --prefix=${{ env.HOMEBREW_PREFIX }}
          ${{ env.ARCH_CMD }} make -j$(sysctl -n hw.ncpu)
          sudo ${{ env.ARCH_CMD }} make install

      - name: Install SDL_mixer
        run: |
          curl -LO https://www.libsdl.org/projects/SDL_mixer/release/SDL_mixer-1.2.12.tar.gz
          tar -xzf SDL_mixer-1.2.12.tar.gz
          cd SDL_mixer-1.2.12
          ${{ env.ARCH_CMD }} ./configure --prefix=${{ env.HOMEBREW_PREFIX }}
          ${{ env.ARCH_CMD }} make -j$(sysctl -n hw.ncpu)
          sudo ${{ env.ARCH_CMD }} make install

      - name: Configure CMake
        run: |
          ${{ env.ARCH_CMD }} cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} \
            -DPKG_CONFIG_EXECUTABLE=${{ env.HOMEBREW_PREFIX }}/bin/pkg-config \
            -DCMAKE_CXX_FLAGS="-Wno-dangling-else -Wno-unused-variable"

      - name: Build OpenXcom
        run: |
          ${{ env.ARCH_CMD }} cmake --build build --parallel $(sysctl -n hw.ncpu)

      - name: Create app bundle with all dependencies
        run: |
          # Make a temporary copy of the executable for analysis
          mkdir -p tmp
          cp build/openxcom.app/Contents/MacOS/openxcom tmp/
          
          # Analyze executable dependencies
          echo "Main executable dependencies:"
          otool -L tmp/openxcom
          
          # Create Frameworks directory with proper permissions
          sudo mkdir -p build/openxcom.app/Contents/Frameworks
          sudo chmod 755 build/openxcom.app/Contents/Frameworks
          
          # Now use a shell script to find and copy all dependencies recursively
          cat > copy_dependencies.sh << 'EOL'
          #!/bin/bash
          
          # Parameters
          APP_PATH="build/openxcom.app"
          FRAMEWORKS_PATH="${APP_PATH}/Contents/Frameworks"
          
          # Create a function to copy a library and all its dependencies
          function copy_lib_and_deps() {
            local lib_path="$1"
            local lib_name=$(basename "$lib_path")
            
            # Skip system libraries
            if [[ "$lib_path" == /System/* || "$lib_path" == /usr/lib/* ]]; then
              echo "Skipping system library: $lib_path"
              return
            fi
            
            # Skip if already copied
            if [[ -f "${FRAMEWORKS_PATH}/${lib_name}" ]]; then
              echo "Already copied: $lib_name"
              return
            fi
            
            echo "Copying: $lib_path"
            # Copy the library
            sudo cp -f "$lib_path" "${FRAMEWORKS_PATH}/"
            
            # Set the library ID
            sudo install_name_tool -id "@rpath/$lib_name" "${FRAMEWORKS_PATH}/${lib_name}"
            
            # Get dependencies of this library
            local deps=$(otool -L "$lib_path" | tail -n +2 | awk '{print $1}' | grep -v '@rpath' | grep -v '/System/' | grep -v '/usr/lib/')
            
            # Process each dependency
            for dep in $deps; do
              # Skip self-references
              if [[ "$dep" == "$lib_path" ]]; then
                continue
              fi
              
              # Copy the dependency
              copy_lib_and_deps "$dep"
              
              # Fix the reference in the current library
              local dep_name=$(basename "$dep")
              sudo install_name_tool -change "$dep" "@rpath/$dep_name" "${FRAMEWORKS_PATH}/${lib_name}"
            done
          }
          
          # Start with the main executable
          MAIN_EXE="${APP_PATH}/Contents/MacOS/openxcom"
          
          # Get dependencies of the main executable
          DEPS=$(otool -L "$MAIN_EXE" | tail -n +2 | awk '{print $1}' | grep -v '@rpath' | grep -v '/System/' | grep -v '/usr/lib/')
          
          # Process each dependency
          for dep in $DEPS; do
            copy_lib_and_deps "$dep"
            
            # Fix the reference in the main executable
            dep_name=$(basename "$dep")
            sudo install_name_tool -change "$dep" "@rpath/$dep_name" "$MAIN_EXE"
          done
          
          # Special handling for zlib which is a system library but needs to be bundled
          if otool -L "$MAIN_EXE" | grep -q '/usr/lib/libz.1.dylib'; then
            echo "Handling special case for zlib..."
            if [[ -f "/usr/lib/libz.1.dylib" ]]; then
              sudo cp -f "/usr/lib/libz.1.dylib" "${FRAMEWORKS_PATH}/"
              sudo install_name_tool -change "/usr/lib/libz.1.dylib" "@rpath/libz.1.dylib" "$MAIN_EXE"
            fi
          fi
          
          # Add @rpath to the executable
          sudo install_name_tool -add_rpath @executable_path/../Frameworks "$MAIN_EXE"
          
          # Ensure the entire app bundle has proper permissions
          sudo chmod -R 755 "$APP_PATH"
          sudo chown -R $(whoami) "$APP_PATH"
          EOL
          
          # Make the script executable
          chmod +x copy_dependencies.sh
          
          # Run the script
          ${{ env.ARCH_CMD }} ./copy_dependencies.sh
          
          # Check what libraries were bundled
          echo "Libraries in Frameworks directory:"
          ls -la build/openxcom.app/Contents/Frameworks/
          
          # Remove code signature attributes and sign the app
          sudo xattr -cr build/openxcom.app
          codesign --force --deep --sign - build/openxcom.app
          
          # Verify all dependencies are properly linked
          echo "Final executable dependencies:"
          otool -L build/openxcom.app/Contents/MacOS/openxcom

      # Create a single zip file directly from the app bundle
      - name: Package app bundle
        run: |
          cd build
          mkdir -p "${{ env.FILENAME }}"
          mv openxcom.app "${{ env.FILENAME }}/"
          zip -r "${{ env.FILENAME }}.zip" "${{ env.FILENAME }}"

      # Upload the single zip file
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FILENAME }}
          path: build/${{ env.FILENAME }}.zip
          compression-level: 0  # No additional compression
